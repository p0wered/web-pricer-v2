services:
  webpricer2:
    build: .
    container_name: webpricer2
    restart: unless-stopped
    ports:
      # Тот же внешний порт, что у старой версии: прокси заказчика перенастраивать не нужно.
      - '9091:3000'
    # Значения берутся из файла .env рядом с этим файлом (см. .env.example).
    environment:
      TZ: Europe/Moscow
      APP_SECRET: ${APP_SECRET:-}
      APP_INITIAL_PASSWORD: ${APP_INITIAL_PASSWORD:-}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-120}
      TRUST_PROXY: ${TRUST_PROXY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-Europe/Moscow}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SEARCH_CACHE_SIZE: ${SEARCH_CACHE_SIZE:-100}
    volumes:
      - ./data:/app/data
    # Без лимита Docker хранит логи контейнера бесконечно: держим не больше ~50 МБ (5 файлов по 10 МБ).
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '5'
